name: File Factory isolated acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pdf-preview:
    name: PDF/Office preview regression + Chromium end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Chinese font only for GitHub screenshot accuracy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies safely
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run original and preview regression
        run: npm test
      - name: Install pinned browser controller
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Resolve isolated Chromium binary
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright-core install chromium
            echo "CHROME_PATH=$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
          fi
      - name: Browser PDF preview, extraction, three-page editing and source preservation
        run: node checks/pdf-preview-e2e.cjs
        env:
          PREVIEW_SCREENSHOT: pdf-preview-ci.png
      - name: Office read-only preview (mocked existing Windows converter)
        run: node checks/office-preview-e2e.cjs
        env:
          OFFICE_PREVIEW_SCREENSHOT: office-preview-ci.png
      - name: Phone-width Chrome PDF preview and page operations
        run: node checks/pdf-preview-e2e.cjs
        env:
          QA_MOBILE: '1'
          PREVIEW_SCREENSHOT: mobile-pdf-preview-ci.png
      - name: Phone-width Chrome Office read-only preview
        run: node checks/office-preview-e2e.cjs
        env:
          QA_MOBILE: '1'
          OFFICE_PREVIEW_SCREENSHOT: mobile-office-preview-ci.png
      - name: Preserve test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-preview-chromium-qa
          path: |
            pdf-preview-ci.png
            office-preview-ci.png
            mobile-pdf-preview-ci.png
            mobile-office-preview-ci.png
          if-no-files-found: ignore
          retention-days: 7

  windows-browser-smoke:
    name: Windows Chrome lean smoke (isolated, no RDC)
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - name: Check out exact feature commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned project packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify format/PDF/Office regressions
        run: npm test
      - name: Install isolated browser automation controller
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Locate preinstalled Windows Chrome
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw "GitHub-hosted Windows runner has no preinstalled Chrome" }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real Windows Chrome PDF page editing and damage handling
        run: node checks/pdf-preview-e2e.cjs
        env:
          PREVIEW_SCREENSHOT: windows-pdf-preview.png
      - name: Real Windows Chrome Office preview route and source safety
        run: node checks/office-preview-e2e.cjs
        env:
          OFFICE_PREVIEW_SCREENSHOT: windows-office-preview.png
      - name: Retain Windows smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-windows-chrome-smoke
          path: |
            windows-pdf-preview.png
            windows-office-preview.png
          if-no-files-found: ignore
          retention-days: 7
