name: File Factory isolated acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pdf-preview:
    name: PDF and image regression + Chromium end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies safely
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run original and preview regression
        run: npm test
      - name: Install pinned browser controller
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Resolve isolated Chromium binary
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright-core install chromium
            echo "CHROME_PATH=$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
          fi
      - name: Browser PDF preview, extraction, three-page editing and source preservation
        run: node checks/pdf-preview-e2e.cjs
        env:
          PREVIEW_SCREENSHOT: pdf-preview-ci.png
      - name: MiniPaint image editor, pixel-change, source integrity and offline smoke
        run: node checks/image-editor-e2e.cjs
        env:
          IMAGE_EDITOR_SCREENSHOT: image-editor-ci.png
      - name: Office visual preview read-only browser acceptance
        run: node checks/office-preview-e2e.cjs
        env:
          OFFICE_PREVIEW_SCREENSHOT: office-preview-ci.png
      - name: Preserve test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-factory-chromium-qa
          path: |
            pdf-preview-ci.png
            image-editor-ci.png
            image-editor-mobile-ci.png
            office-preview-ci.png
          if-no-files-found: ignore
          retention-days: 7

  pdf-draw-text-probe:
    name: Experimental PDF existing-Chinese-text replacement (LibreOffice Draw)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out experimental source without production deployment
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install existing LibreOffice Draw and system UNO tooling
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libreoffice-draw python3-uno python3-reportlab fonts-arphic-gbsn00lp poppler-utils
      - name: Edit real two-page Chinese PDF then verify text and reject unsafe cases
        run: /usr/bin/python3 checks/pdf-text-probe-qa.py
